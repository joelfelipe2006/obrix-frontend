<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minhas solicitacoes — Obrix</title>
  <link rel="stylesheet" href="css/obrix.css">
  <style>
    .cartao-servico { display: grid; gap: var(--e3); }
    @media (min-width: 820px) {
      .cartao-servico { grid-template-columns: 1fr auto auto; align-items: center; }
    }
    .cartao-servico .cabecalho { display: flex; align-items: center; gap: var(--e2); flex-wrap: wrap; }
    .cartao-servico .cabecalho .meta { font-size: 13px; color: var(--texto-3); }
    .cartao-servico h3 { margin-top: 6px; }
    .cartao-servico .sub { font-size: 14px; color: var(--texto-2); margin-top: 3px; }
    .valor-bloco { text-align: left; }
    @media (min-width: 820px) { .valor-bloco { text-align: right; } }
    .valor-rotulo { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--texto-3); }
    .valor-numero { font-size: 22px; font-weight: 700; }
    .prazo { font-size: 13px; color: var(--alerta); font-weight: 600; margin-top: 2px; }
    .acoes { display: grid; gap: var(--e2); }
    @media (min-width: 820px) { .acoes { min-width: 190px; } }
    .nota-contestada { font-size: 13.5px; color: var(--texto-2); margin-top: var(--e2); }
    .destaque-valor { font-size: 34px; font-weight: 700; letter-spacing: -.02em; }
    .lista-efeitos { margin: 12px 0 0; padding-left: 18px; color: var(--texto-2); font-size: 14.5px; }
    .lista-efeitos li { margin-bottom: 5px; }
  </style>
</head>
<body>
<header data-topo></header>
<main class="container painel">
  <h1 class="painel-titulo">Minhas solicitacoes</h1>
  <p class="painel-apoio">Acompanhe cada servico e aja quando for a sua vez.</p>

  <div class="abas" role="tablist" id="abas">
    <button class="aba" role="tab" data-filtro="todas" aria-selected="true">Todas</button>
    <button class="aba" role="tab" data-filtro="andamento" aria-selected="false">Em andamento</button>
    <button class="aba" role="tab" data-filtro="aguardando" aria-selected="false">Aguardando voce</button>
    <button class="aba" role="tab" data-filtro="concluidas" aria-selected="false">Concluidas</button>
    <button class="aba" role="tab" data-filtro="canceladas" aria-selected="false">Encerradas</button>
  </div>

  <div id="lista"></div>
</main>

<footer class="rodape">
  <div class="container rodape-interno">
    <span>Termos de uso</span><span class="direita">Obrix &middot; 2026</span>
  </div>
</footer>

<script src="js/demo.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/pagina-painel-cliente.js"></script>
</body>
</html>
