<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil do profissional — Obrix</title>
  <link rel="stylesheet" href="css/obrix.css">
  <style>
    .cabecalho-perfil { display: grid; gap: var(--e3); }
    @media (min-width: 680px) {
      .cabecalho-perfil { grid-template-columns: auto 1fr auto; align-items: center; }
    }
    .cabecalho-perfil .avatar { width: 62px; height: 62px; font-size: 20px; }
    .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--e2); }
    .etiqueta {
      font-size: 12.5px; background: var(--fundo); border: 1px solid var(--linha);
      border-radius: var(--raio-pill); padding: 3px 10px; color: var(--texto-2);
    }
    .avaliacao-item { padding: var(--e3) 0; border-top: 1px solid var(--linha); }
    .avaliacao-item:first-child { border-top: none; }
    .avaliacao-item .meta { font-size: 13px; color: var(--texto-3); margin-top: 4px; }
  </style>
</head>
<body>
<header data-topo></header>
<main class="container painel">
  <p class="painel-apoio"><a href="javascript:history.back()">&larr; Voltar aos resultados</a></p>
  <div id="perfil"></div>
</main>
<footer class="rodape">
  <div class="container rodape-interno">
    <span>Termos de uso</span>
    <span>Politica de privacidade</span>
    <span class="direita">Obrix &middot; 2026</span>
  </div>
</footer>

<script src="js/demo.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/pagina-perfil.js"></script>
</body>
</html>
